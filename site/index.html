const START=Date.parse('2026-09-15T00:00:00+08:00');
const END=Date.parse('2026-12-01T00:00:00+08:00');
function checkWindow(now=Date.now()) { if(now<START)throw new Error('手册尚未开放，请于 9 月 15 日再来。');if(now>=END)throw new Error('手册有效期已结束。'); }
async function unlock(password,now=Date.now()) {
 checkWindow(now);
 const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)},key,decode(payload.data));
 return new TextDecoder().decode(bytes);
}

<script>
const form=document.getElementById('form'),input=document.getElementById('password'),button=document.getElementById('submit'),status=document.getElementById('status'),gate=document.getElementById('gate');
