const END=Date.parse('2026-12-01T00:00:00+08:00');
function checkWindow(now=Date.now()) { if(now<START)throw new Error('手册尚未开放，请于 9 月 15 日再来。');if(now>=END)throw new Error('手册有效期已结束。'); }
async function unlock(password,now=Date.now()) {
 checkWindow(now);
 const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)},key,decode(payload.data));
 return new TextDecoder().decode(bytes);
}

<script>
const form=document.getElementById('form'),input=document.getElementById('password'),button=document.getElementById('submit'),status=document.getElementById('status'),gate=document.getElementById('gate');
let frame;
function updateWindow(){try{checkWindow();if(!crypto.subtle){status.textContent='请使用支持加密功能的浏览器，通过 HTTPS 链接打开。';button.disabled=true;return false;}button.disabled=false;input.disabled=false;if(status.textContent.includes('尚未开放'))status.textContent='';return true;}catch(e){if(frame){frame.remove();frame=null;gate.hidden=false;}status.textContent=e.message;button.disabled=true;input.disabled=true;return false;}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!updateWindow())return;button.disabled=true;status.textContent='正在解锁…';try{const html=await unlock(input.value);if(!updateWindow())return;input.value='';frame=document.createElement('iframe');frame.title='新疆婚礼旅行手册';frame.referrerPolicy='strict-origin';frame.setAttribute('sandbox','allow-scripts allow-same-origin');frame.srcdoc=html;document.body.append(frame);gate.hidden=true;status.textContent='';}catch(e){status.textContent=e.name==='OperationError'?'密码不正确，请重新输入。':e.message;input.value='';input.focus();}finally{updateWindow();}});
updateWindow();setInterval(updateWindow,10000);document.addEventListener('visibilitychange',updateWindow);
